name: Build posts.json

on:
  push:
    branches: [main]
    paths:
      - "blog/posts/**.md"
      - "scripts/build-posts.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/build-posts.js

      - name: Commit if changed
        run: |
          if git diff --quiet blog/posts.json; then
            echo "posts.json unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add blog/posts.json
          git commit -m "chore: regenerate posts.json"
          git push