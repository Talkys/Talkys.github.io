<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Post...</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/bg.js"></script>

    <!-- Dependencies for on-the-fly markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <!-- External Article Renderer -->
    <script src="/blog/article-renderer.js"></script>
</head>

<body
    class="bg-zinc-950 text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white font-sans min-h-screen flex flex-col">
    <canvas id="bg-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <!-- Header / Navigation -->
    <header class="sticky top-0 z-50 w-full border-b border-zinc-900 bg-zinc-950/80 backdrop-blur-md">
        <div class="mx-auto flex max-w-6xl items-center justify-between p-4 md:px-8">
            <a href="/"
                class="text-xs sm:text-sm font-semibold tracking-wider hover:text-zinc-400 transition-colors whitespace-nowrap">
                Tallys Assis
            </a>
            <nav class="flex items-center gap-3 sm:gap-6 text-xs sm:text-sm text-zinc-400">
                <a href="/about.html" class="hover:text-zinc-100 transition-colors">About</a>
                <a href="/projects.html" class="hover:text-zinc-100 transition-colors">Projects</a>
                <a href="/experience.html" class="hover:text-zinc-100 transition-colors">Experience</a>
                <a href="/blog/home.html" class="text-zinc-100 font-medium">Blog</a>
                <a href="/contact.html" class="hover:text-zinc-100 transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content & Sidebar Layout -->
    <main class="relative z-10 mx-auto max-w-6xl w-full px-4 py-8 md:px-8 md:py-16 flex-1">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-12 items-start">

            <!-- Main Post Article Area (3 Cols on Desktop) -->
            <article class="lg:col-span-3 space-y-8 max-w-3xl">

                <!-- Article Header -->
                <header class="space-y-4 border-b border-zinc-900 pb-8">
                    <div class="flex items-center gap-3 text-xs font-mono text-zinc-500">
                        <time id="post-date" datetime=""></time>
                        <span>•</span>
                        <span id="post-category" class="rounded bg-zinc-900 border border-zinc-800 px-2 py-0.5 text-zinc-400"></span>
                    </div>
                    <h1 id="post-title" class="text-3xl font-light tracking-tight sm:text-4xl text-zinc-100">
                        Loading...
                    </h1>
                </header>

                <!-- Article Body Content -->
                <div id="post-body" class="space-y-7 text-zinc-300 leading-relaxed text-base">
                    <!-- Markdown content and GitHub CTA will be injected here -->
                </div>

                <!-- Post Footer / Navigation Link -->
                <div class="border-t border-zinc-900 pt-6">
                    <a id="post-backlink" href="/blog/home.html"
                        class="inline-flex items-center gap-2 text-xs text-zinc-400 hover:text-zinc-100 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                        </svg>
                        Back to all articles
                    </a>
                </div>

            </article>

            <!-- Right Sidebar: Date Tree Posts -->
            <aside class="lg:col-span-1 rounded-xl border border-zinc-900 bg-zinc-900/20 p-5 space-y-4 sticky top-24">
                <div class="flex items-center justify-between border-b border-zinc-800/60 pb-3">
                    <h2 class="text-xs font-semibold uppercase tracking-widest text-zinc-500">
                        Archive Tree
                    </h2>
                    <span id="post-count"
                        class="text-[10px] font-mono text-zinc-500 bg-zinc-900 px-1.5 py-0.5 rounded border border-zinc-800">
                        Loading...
                    </span>
                </div>

                <!-- Tree Container -->
                <div id="posts-tree" class="space-y-3 text-xs text-zinc-400">
                    <!-- Tree items rendered via JS script below -->
                </div>
            </aside>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 border-t border-zinc-900 bg-zinc-950 py-8 mt-auto">
        <div class="mx-auto max-w-6xl px-4 text-center text-xs text-zinc-600 md:px-8">
            <p>&copy; 2026 Tallys Assis. All rights reserved.</p>
        </div>
    </footer>

    <!-- JSON Loader & Tree Renderer Script -->
    <script src="/blog/posts.js"></script>

    <!-- Trigger the Markdown load -->
    <script>
        // You can pass a static path or read it from URL query params (e.g. ?id=esp32-chess)
        const params = new URLSearchParams(window.location.search);
        const postName = params.get("id"); 
        loadAndRenderPost(`/blog/posts/${postName}.md`);
    </script>
</body>

</html>
